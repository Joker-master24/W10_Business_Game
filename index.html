<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#24352f;--muted:#718078;--cream:#fff9ed;--paper:#fffdf8;--green:#28765a;--green2:#e5f2e8;--orange:#ef9959;--yellow:#f2cf69;--line:#eae5d9;--red:#d86852;--shadow:0 12px 32px #39503a12}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Nunito','Noto Sans TC',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #85b59a;outline-offset:3px}.shell{max-width:1120px;margin:auto;padding:0 28px 64px}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e9e3d6}.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:16px}.brand-icon{width:38px;height:38px;background:#dcefe0;border-radius:12px;display:grid;place-items:center;font-size:21px}.nav-right{display:flex;align-items:center;gap:14px}.sound,.reset{border:1px solid var(--line);background:#fffdf8;border-radius:99px;padding:8px 13px;color:#53635b;font-size:13px;font-weight:700}.sound{display:flex;align-items:center;gap:6px}.sound-dot{width:8px;height:8px;border-radius:50%;background:#a1b6a7}.sound.on .sound-dot{background:#53a774}.day-pill{border-radius:99px;padding:8px 14px;background:#f5edda;font-size:12px;font-weight:800;color:#7b6b42;letter-spacing:.5px}.progress-wrap{display:flex;align-items:center;gap:12px;margin:22px auto 0;max-width:680px}.progress-track{height:8px;background:#e8e6da;border-radius:99px;flex:1;overflow:hidden}.progress-fill{height:100%;background:var(--green);border-radius:99px;transition:width .4s}.progress-label{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap}.hero{text-align:center;padding:38px 0 28px}.eyebrow{font-weight:900;color:var(--green);font-size:11px;letter-spacing:2px}.hero h1{font-size:clamp(34px,5vw,52px);line-height:1.16;margin:10px 0 11px;letter-spacing:-1px}.hero p{font-size:15px;color:var(--muted);margin:0}.main{max-width:866px;margin:0 auto}.step-title{display:flex;align-items:center;gap:10px;margin:0 0 15px;font-size:16px;font-weight:900}.step-number{width:24px;height:24px;border-radius:8px;background:var(--green);color:white;font-size:12px;display:grid;place-items:center}.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.shop-card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:18px 18px 16px;text-align:left;transition:.2s;min-height:178px;position:relative;color:var(--ink)}.shop-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.shop-card.selected{border-color:var(--green);box-shadow:0 0 0 3px #28765a15}.shop-card.selected:after{content:'✓';position:absolute;right:14px;top:14px;background:var(--green);color:#fff;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-size:13px}.shop-emoji{font-size:29px}.shop-name{font-weight:900;font-size:17px;margin:9px 0 3px}.shop-desc{font-size:12px;color:var(--muted);line-height:1.5}.shop-tag{display:inline-block;margin-top:10px;color:#67806d;font-size:10px;font-weight:800;background:#edf4eb;border-radius:99px;padding:4px 8px}.bottom-row{display:flex;justify-content:flex-end;margin:15px 0 27px}.primary{background:var(--green);border:0;color:#fff;border-radius:11px;padding:12px 22px;font-weight:900;box-shadow:0 4px 0 #1d6047;transition:.15s}.primary:hover{background:#21694f;transform:translateY(-1px)}.primary:disabled{background:#bdc6bb;box-shadow:0 4px 0 #aab4a8;cursor:not-allowed;transform:none}.challenge{display:grid;grid-template-columns:235px 1fr;gap:15px;margin-top:23px}.side-card,.game-card{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:18px}.side-card{background:#f6f2e7}.side-heading{font-size:12px;color:#7a8175;font-weight:900;margin-bottom:12px}.money-row{display:flex;justify-content:space-between;font-size:12px;padding:8px 0;border-bottom:1px dashed #ddd8ca}.money-row:last-child{border:0}.money-row b{font-size:13px}.profit{color:var(--green)}.loss{color:var(--red)}.tip{border-radius:12px;background:#fff7db;padding:11px 12px;font-size:11px;color:#746841;line-height:1.55;margin-top:14px}.round{font-size:11px;font-weight:900;color:#9a7a38;letter-spacing:.7px}.question{font-size:19px;line-height:1.6;font-weight:900;margin:9px 0 15px}.question-emoji{font-size:29px;float:right;margin-left:9px}.answers{display:grid;gap:9px}.answer{background:white;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left;color:var(--ink);font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center;transition:.15s}.answer:hover:not(:disabled){border-color:#8caf96;background:#fbfdf9}.answer.chosen{border-color:var(--green);background:#eff7f0}.answer.correct{border-color:#67ad79;background:#edf7ee}.answer.wrong{border-color:#dc8774;background:#fff1ed}.letter{flex:none;border:1px solid #e5e2d9;background:#f8f6f0;border-radius:7px;width:23px;height:23px;display:grid;place-items:center;color:#7d857c;font-size:11px;font-weight:900}.answer.correct .letter{background:var(--green);color:white;border-color:var(--green)}.answer.wrong .letter{background:var(--red);color:white;border-color:var(--red)}.feedback{padding:11px 13px;border-radius:11px;margin-top:11px;font-size:12px;line-height:1.6}.feedback.good{background:#edf7ee;color:#326443}.feedback.bad{background:#fff2e7;color:#805c39}.action-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;min-height:41px}.helper{font-size:11px;color:#899187}.primary.small{padding:10px 17px;font-size:12px}.money-head{display:flex;justify-content:space-between;align-items:start}.shop-stage{font-size:12px;font-weight:900;background:#e7f2e6;color:#44704d;border-radius:99px;padding:7px 11px}.badge{background:#f7edcf;color:#866d35;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900}.shelf{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.item{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 11px;display:flex;align-items:center;gap:9px}.item-icon{font-size:23px}.item-info{min-width:0;flex:1}.item-name{font-size:12px;font-weight:900}.item-price{font-size:10px;color:var(--muted);margin-top:2px}.item-price b{color:var(--ink)}.qty{display:flex;align-items:center;gap:5px}.qty button{border:1px solid var(--line);background:#faf9f3;width:25px;height:25px;border-radius:8px;color:#47654f;font-weight:900;padding:0}.qty span{font-size:12px;font-weight:900;width:12px;text-align:center}.cartline{display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:12px}.cartline strong{font-size:16px}.cartline strong.over{color:var(--red)}.need-want{display:flex;gap:8px;margin-top:10px}.need-want span{font-size:10px;padding:5px 8px;border-radius:99px;background:#f0f4ea;color:#66745e;font-weight:800}.end{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px}.end-icon{font-size:48px}.end h2{font-size:27px;margin:7px 0}.end p{color:var(--muted);line-height:1.7;font-size:14px}.stat-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{padding:11px 16px;background:#f5f3e9;border-radius:12px;min-width:105px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{font-size:17px}.restart{margin-top:5px}.footer{text-align:center;color:#a1a499;font-size:10px;margin-top:30px}.hidden{display:none!important}
@media(max-width:700px){.shell{padding:0 17px 42px}.nav{height:64px}.brand{font-size:13px}.brand-icon{width:33px;height:33px}.nav-right{gap:7px}.sound{padding:7px 9px;font-size:11px}.day-pill{padding:7px 9px;font-size:10px}.hero{padding:29px 0 22px}.hero p{font-size:13px}.shop-grid{grid-template-columns:1fr;gap:9px}.shop-card{min-height:0;display:grid;grid-template-columns:42px 1fr;align-items:center;padding:12px 14px}.shop-emoji{grid-row:span 2}.shop-name{margin:0}.shop-desc{grid-column:2}.shop-tag{display:none}.shop-card.selected:after{top:10px;right:10px}.challenge{grid-template-columns:1fr;margin-top:15px;gap:10px}.side-card{padding:13px 15px}.side-heading{margin-bottom:3px}.money-row{display:inline-flex;flex-direction:column;gap:3px;width:32%;border:0;padding:7px 0}.money-row b{font-size:12px}.tip{margin-top:4px;padding:8px 10px}.game-card{padding:15px}.question{font-size:17px}.shelf{grid-template-columns:1fr}.bottom-row{margin-bottom:19px}}
</style>
</head>
<body>
<div class="shell">
 <header class="nav"><div class="brand"><span class="brand-icon">🌱</span><span>小小商店老闆</span></div><div class="nav-right"><button class="sound" id="soundBtn" type="button" aria-pressed="false"><span class="sound-dot"></span><span id="soundLabel">音效關閉</span></button><span class="day-pill">✦ 理財冒險日記</span></div></header>
 <div class="progress-wrap"><span class="progress-label" id="progressText">準備開店</span><div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div><span class="progress-label" id="progressCount">0 / 6</span></div>
 <section class="hero"><div class="eyebrow">✦ 小小老闆，準備好了嗎？ ✦</div><h1>今天，我來當老闆！</h1><p>做聰明的選擇、照顧好你的錢，讓夢想慢慢長大。</p></section>
 <main class="main" id="app"></main><footer class="footer">每一個聰明選擇，都是給未來自己的小小禮物 🌿</footer>
</div>
<script>
const shops=[
 {id:'drink',emoji:'🧋',name:'珍珠奶茶店',desc:'採買材料、訂個好價格，讓客人喝得開心。',tag:'成本 × 定價'},
 {id:'stationery',emoji:'✏️',name:'文具小鋪',desc:'挑選受歡迎的文具，精打細算把握利潤。',tag:'進貨 × 儲蓄'},
 {id:'farm',emoji:'🥕',name:'陽光小農場',desc:'細心照顧作物，面對天氣變化也不慌張。',tag:'收成 × 風險'}
];
const questions=[
 {round:'任務 1 · 算算成本',emoji:'🧾',title:'開店第一步，先買材料。每杯奶茶材料花 20 元，你買了 10 份，一共要付多少？',answers:['120 元','200 元','220 元'],correct:1,why:'20 元 × 10 份 = 200 元，這就是你的材料成本。',delta:0,tip:'先算清楚要花多少，才知道最後有沒有賺到喔！'},
 {round:'任務 2 · 設定價格',emoji:'🏷️',title:'一杯飲料的材料成本是 20 元。你想賣多少，才能付完成本後還有利潤？',answers:['賣 15 元','賣 20 元','賣 30 元'],correct:2,why:'賣 30 元，扣掉 20 元成本，還剩 10 元利潤。',delta:30,tip:'售價減掉成本，就是利潤。賣得多，不一定代表賺得多！'},
 {round:'任務 3 · 遇到小意外',emoji:'🌧️',title:'突然下雨，今天少了幾位客人，收入比預計少 20 元。你會怎麼辦？',answers:['用存下來的錢先付必要開銷，並想想明天怎麼調整','把所有材料都丟掉，不再開店','立刻借很多錢買更多材料'],correct:0,why:'先照顧必要開銷，再從經驗調整計畫，遇到變化也能穩穩前進。',delta:-20,tip:'做生意有時會遇到變化，留一點備用金就能更安心。'},
 {round:'任務 4 · 分配利潤',emoji:'🐷',title:'你今天賺到 40 元利潤，想把一部分存起來，為以後的大目標做準備。哪個做法最好？',answers:['全部花光，明天再說','先存 20 元，剩下的再安排使用','全部拿去買不需要的東西'],correct:1,why:'先存下一部分，剩下的再使用；小小儲蓄也能慢慢累積。',delta:0,tip:'儲蓄可以幫你準備未來想做的事，也能應付臨時需要。'},
 {round:'任務 5 · 認識投資',emoji:'🌱',title:'你有一筆存款，想用來讓農場長得更好。哪個選擇最聰明？',answers:['了解成本與可能風險後，先用一小部分試種新作物','把所有存款都押在一種作物上','聽到別人說會賺，就馬上投入全部的錢'],correct:0,why:'先了解風險、從小額開始，可以學習投資，也避免一次承擔太大損失。',delta:10,tip:'投資有機會增加收入，也可能虧損；先了解，再分散風險。'}
];
const goods=[
 {id:'rice',icon:'🍚',name:'白米',price:35,need:true}, {id:'milk',icon:'🥛',name:'鮮奶',price:30,need:true},
 {id:'eggs',icon:'🥚',name:'雞蛋',price:25,need:true}, {id:'soap',icon:'🧼',name:'肥皂',price:20,need:true},
 {id:'cookies',icon:'🍪',name:'小餅乾',price:15,need:false}, {id:'juice',icon:'🧃',name:'果汁',price:20,need:false},
 {id:'sticker',icon:'✨',name:'亮亮貼紙',price:25,need:false}, {id:'chocolate',icon:'🍫',name:'巧克力',price:18,need:false}
];
const state={shop:null,step:0,money:100,savings:0,selected:null,locked:false,cart:{},sound:false};
const app=document.getElementById('app');
function progress(){const done=state.step;document.getElementById('progressFill').style.width=(done/6*100)+'%';document.getElementById('progressCount').textContent=done+' / 6';document.getElementById('progressText').textContent=done===0?'準備開店':done<6?'冒險進行中':'冒險完成';}
function shopSelection(){app.innerHTML=`<h2 class="step-title"><span class="step-number">1</span>選一間你想經營的小店</h2><div class="shop-grid">${shops.map(s=>`<button class="shop-card ${state.shop===s.id?'selected':''}" data-shop="${s.id}" type="button"><span class="shop-emoji">${s.emoji}</span><span class="shop-name">${s.name}</span><span class="shop-desc">${s.desc}</span><span class="shop-tag">${s.tag}</span></button>`).join('')}</div><div class="bottom-row"><button class="primary" id="startBtn" ${state.shop?'':'disabled'}>選好了，開始闖關　→</button></div>`;app.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{state.shop=b.dataset.shop;shopSelection()});document.getElementById('startBtn').onclick=()=>{if(!state.shop)return;state.step=1;render()}}
function sidebar(){return `<aside class="side-card"><div class="side-heading">📒 老闆的小帳本</div><div class="money-row"><span>起始資金</span><b>100 元</b></div><div class="money-row"><span>目前資金</span><b class="${state.money<100?'loss':'profit'}">${state.money} 元</b></div><div class="money-row"><span>我的存款</span><b class="profit">${state.savings} 元</b></div><div class="tip">💡 ${questions[Math.min(state.step-1,4)]?.tip||'記得看清楚預算，聰明挑選需要的東西！'}</div></aside>`}
function questionView(){const q=questions[state.step-1];app.innerHTML=`${sidebar()}<section class="challenge"><div class="game-card" style="grid-column:1/-1"><div class="round">${q.round}</div><div class="question"><span class="question-emoji">${q.emoji}</span>${q.title}</div><div class="answers">${q.answers.map((a,i)=>`<button class="answer ${state.selected===i?'chosen':''}" data-answer="${i}" ${state.locked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${a}</span></button>`).join('')}</div>${state.locked?`<div class="feedback ${state.selected===q.correct?'good':'bad'}">${state.selected===q.correct?'✨ 答對了！':'🌼 沒關係，再學一次！'} ${q.why}</div>`:''}<div class="action-row"><span class="helper">${state.locked?'好選擇，準備迎接下一個任務！':'選出你覺得最好的做法'}</span>${state.locked?`<button class="primary small" id="nextBtn">${state.step===5?'前往超市偵探':'下一個任務'}　→</button>`:''}</div></div></section>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(state.locked)return;state.selected=Number(b.dataset.answer);state.locked=true;const correct=state.selected===q.correct;if(correct){state.money=Math.max(0,state.money+q.delta);if(state.step===4){state.savings+=20;state.money=Math.max(0,state.money-20)}}else if(q.delta<0){state.money+=q.delta}playTone(correct);render()});const n=document.getElementById('nextBtn');if(n)n.onclick=()=>{state.step++;state.selected=null;state.locked=false;render()}}
function cartTotal(){return Object.entries(state.cart).reduce((s,[id,q])=>s+goods.find(g=>g.id===id).price*q,0)}
function market(){const total=cartTotal(),count=Object.values(state.cart).reduce((a,b)=>a+b,0),needs=goods.filter(g=>g.need).reduce((n,g)=>n+(state.cart[g.id]||0),0),wants=goods.filter(g=>!g.need).reduce((n,g)=>n+(state.cart[g.id]||0),0);app.innerHTML=`${sidebar()}<section class="challenge"><div class="game-card" style="grid-column:1/-1"><div class="money-head"><div><div class="round">最終任務 · 超市偵探</div><div class="question" style="margin-bottom:5px"><span class="question-emoji">🛒</span>帶著 100 元預算，聰明採買！</div></div><span class="badge">💰 預算 100 元</span></div><div style="font-size:12px;color:var(--muted);line-height:1.6">選出 <b style="color:var(--ink)">3 項必需品</b>和 <b style="color:var(--ink)">1 項想要的物品</b>。必需品和想要的東西都可以挑，記得結帳不能超過預算！</div><div class="need-want"><span>🔵 必需品：米、奶、蛋、肥皂</span><span>🟡 想要：零食與飲料</span></div><div class="shelf">${goods.map(g=>`<div class="item"><span class="item-icon">${g.icon}</span><div class="item-info"><div class="item-name">${g.name} ${g.need?'<span style="color:#679477;font-size:9px">必需</span>':'<span style="color:#c19042;font-size:9px">想要</span>'}</div><div class="item-price"><b>${g.price} 元</b>／個</div></div><div class="qty"><button data-change="${g.id}" data-delta="-1" aria-label="少買一個${g.name}">−</button><span>${state.cart[g.id]||0}</span><button data-change="${g.id}" data-delta="1" aria-label="多買一個${g.name}">＋</button></div></div>`).join('')}</div><div class="cartline"><span>購物車　${needs} 項必需品 · ${wants} 項想要</span><strong class="${total>100?'over':''}">${total} / 100 元</strong></div>${state.locked?`<div class="feedback good">🎉 ${needs>=3&&wants>=1&&total<=100?'完美採買！':'任務完成！'} ${state.endMessage}</div>`:''}<div class="action-row"><span class="helper">${total>100?'超出預算了，試著換一樣商品！':`還可以使用 ${100-total} 元`}</span>${state.locked?`<button class="primary small" id="finishBtn">查看我的成績　→</button>`:`<button class="primary small" id="checkoutBtn" ${needs<3||wants<1||total>100?'disabled':''}>${needs<3||wants<1?'再選商品':'完成採買'}　→</button>`}</div></div></section>`;app.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{let v=(state.cart[b.dataset.change]||0)+Number(b.dataset.delta);if(v<0)return;if(v===0)delete state.cart[b.dataset.change];else state.cart[b.dataset.change]=v;render()});const c=document.getElementById('checkoutBtn');if(c)c.onclick=()=>{if(c.disabled)return;state.locked=true;state.money-=total;state.endMessage=`你選了 ${needs} 項必需品和 ${wants} 項想要的物品，剛剛好沒有超過預算，真是聰明的消費者！`;render()};const f=document.getElementById('finishBtn');if(f)f.onclick=()=>{state.step=6;render()}}
function ending(){const net=state.money+state.savings,earned=net-100;app.innerHTML=`<section class="end"><div class="end-icon">${earned>=0?'🏆':'🌱'}</div><div class="eyebrow">✦ 小小老闆的冒險完成 ✦</div><h2>你的每個選擇，都讓你更會理財！</h2><p>你經歷了開店、計算成本、設定價格、面對變化、存下利潤，<br>還在超市用預算買到需要的東西。這就是理財高手的日常！</p><div class="stat-row"><div class="stat"><small>結束時的資金</small><b>${state.money} 元</b></div><div class="stat"><small>存下來的錢</small><b>${state.savings} 元</b></div><div class="stat"><small>理財小成績</small><b class="${earned>=0?'profit':'loss'}">${earned>=0?'+':''}${earned} 元</b></div></div><p style="font-size:12px">🌟 記住：想一想、比一比、先存一點點，錢就能幫你完成更多夢想。</p><button class="primary restart" id="restartBtn">再玩一次　↻</button></section>`;document.getElementById('restartBtn').onclick=()=>{state.shop=null;state.step=0;state.money=100;state.savings=0;state.selected=null;state.locked=false;state.cart={};state.endMessage='';render()}}
function render(){progress();if(state.step===0)shopSelection();else if(state.step<=5)questionView();else if(state.step===6)market();else ending()}
let audioCtx;function playTone(ok){if(!state.sound)return;try{audioCtx ||= new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=ok?660:280;g.gain.value=.07;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.stop(audioCtx.currentTime+.18)}catch(e){}}
document.getElementById('soundBtn').onclick=()=>{state.sound=!state.sound;const b=document.getElementById('soundBtn');b.classList.toggle('on',state.sound);b.setAttribute('aria-pressed',state.sound);document.getElementById('soundLabel').textContent=state.sound?'音效開啟':'音效關閉';if(state.sound)playTone(true)};
render();
</script>
</body>
</html>
